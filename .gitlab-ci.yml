# GitLab CI/CD Pipeline for Leaf Server
# This pipeline handles linting, testing, building, and deployment of the Node.js/TypeScript server

stages:
  - lint
  - test
  - build

# Cache node_modules for faster builds
cache:
  key: 
    files:
      - leaf_server/package-lock.json
  paths:
    - leaf_server/node_modules/

# Variables
variables:
  NODE_VERSION: "18"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  NODE_ENV: "test"

# Lint stage - Check code quality and formatting
lint:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Checking TypeScript compilation..."
    - npx tsc --noEmit
    - echo "Linting complete - TypeScript compilation successful"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Test stage - Run unit tests with coverage
test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Running tests with coverage..."
    - npm run test:coverage
    - echo "Tests completed successfully"
  coverage: '/All files\s+\|\s+(\d+\.\d+)%/'  # Extract coverage percentage
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Build stage - Compile TypeScript to JavaScript
build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Building TypeScript project..."
    - npm run build
    - echo "Build completed successfully"
    - ls -la dist/
  artifacts:
    paths:
      - dist/
      - package.json
      - package-lock.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Security audit stage
security-audit:
  stage: test
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Running security audit..."
    - npm audit --audit-level=moderate
    - echo "Security audit completed"
  allow_failure: true  # Don't fail pipeline for security warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH





# Notify on pipeline success/failure
notify:
  stage: .post
  image: alpine:latest
  script:
    - echo "Pipeline completed successfully"
    - echo "This could send notifications to Slack, Discord, or email"
  rules:
    - when: always
  allow_failure: true 