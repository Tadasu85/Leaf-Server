# GitLab CI/CD Pipeline for Leaf Server
# This pipeline handles linting, testing, building, and deployment of the Node.js/TypeScript server

stages:
  - lint
  - test
  - build

# Cache the npm download cache (npm ci always rebuilds node_modules anyway)
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

# Variables
variables:
  NODE_VERSION: "22"  # Node 18 is end-of-life; jest-junit needs 20+
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  NODE_ENV: "test"

# Lint stage - Check code quality and formatting
lint:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Checking TypeScript compilation..."
    - npx tsc --noEmit
    - echo "Linting complete - TypeScript compilation successful"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Test stage - Run unit tests with coverage
test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Running tests with coverage..."
    - npm run test:coverage
    - echo "Tests completed successfully"
  coverage: '/All files\s+\|\s+(\d+\.\d+)%/'  # Extract coverage percentage
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
      junit: coverage/junit.xml
    paths:
      - coverage/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Build stage - Compile TypeScript to JavaScript
build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Building TypeScript project..."
    - npm run build
    - echo "Build completed successfully"
    - ls -la dist/
  artifacts:
    paths:
      - dist/
      - package.json
      - package-lock.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Security audit
# Blocking: anything high or critical in the packages that actually run on Render.
# Report only: the full tree including test tooling (jest, nodemon), which never
# ships. Its remaining moderate findings have no non-breaking fix.
security-audit:
  stage: test
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Production dependencies (blocking on high or critical)..."
    - npm audit --omit=dev --audit-level=high
    - echo "Full dependency tree including dev tooling (report only)..."
    - npm audit --audit-level=critical || echo "Dev tooling has findings; see report above"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH





# Notify on pipeline success/failure
notify:
  stage: .post
  image: alpine:latest
  script:
    - echo "Pipeline completed successfully"
    - echo "This could send notifications to Slack, Discord, or email"
  rules:
    - when: always
  allow_failure: true 