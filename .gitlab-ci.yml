# GitLab CI/CD Pipeline for Leaf Server
# This pipeline handles linting, testing, building, and deployment of the Node.js/TypeScript server

stages:
  - lint
  - test
  - build
  - deploy

# Cache node_modules for faster builds
cache:
  key: 
    files:
      - leaf_server/package-lock.json
  paths:
    - leaf_server/node_modules/

# Variables
variables:
  NODE_VERSION: "18"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  NODE_ENV: "test"

# Lint stage - Check code quality and formatting
lint:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Checking TypeScript compilation..."
    - npx tsc --noEmit
    - echo "Linting complete - TypeScript compilation successful"
  artifacts:
    reports:
      junit: coverage/junit.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Test stage - Run unit tests with coverage
test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Running tests with coverage..."
    - npm run test:coverage
    - echo "Tests completed successfully"
  coverage: '/All files\s+\|\s+(\d+\.\d+)%/'  # Extract coverage percentage
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
      junit: coverage/junit.xml
    paths:
      - coverage/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Build stage - Compile TypeScript to JavaScript
build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Building TypeScript project..."
    - npm run build
    - echo "Build completed successfully"
    - ls -la dist/
  artifacts:
    paths:
      - dist/
      - package.json
      - package-lock.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Security audit stage
security-audit:
  stage: test
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Running security audit..."
    - npm audit --audit-level=moderate
    - echo "Security audit completed"
  allow_failure: true  # Don't fail pipeline for security warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Deploy to staging (for merge requests and main branch)
deploy-staging:
  stage: deploy
  image: node:${NODE_VERSION}-alpine
  environment:
    name: staging
    url: https://staging.leaf-server.com  # Update with your staging URL
  before_script:
    - echo "Preparing deployment to staging..."
  script:
    - echo "Deploying to staging environment..."
    - echo "This would typically involve deploying to your staging server"
    - echo "For now, this is a placeholder deployment step"
  dependencies:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual  # Manual deployment for staging

# Deploy to production (for tags only)
deploy-production:
  stage: deploy
  image: node:${NODE_VERSION}-alpine
  environment:
    name: production
    url: https://leaf-server.com  # Update with your production URL
  before_script:
    - echo "Preparing deployment to production..."
  script:
    - echo "Deploying to production environment..."
    - echo "This would typically involve deploying to your production server"
    - echo "For now, this is a placeholder deployment step"
  dependencies:
    - build
  rules:
    - if: $CI_COMMIT_TAG
      when: manual  # Manual deployment for production



# Notify on pipeline success/failure
notify:
  stage: .post
  image: alpine:latest
  script:
    - echo "Pipeline completed successfully"
    - echo "This could send notifications to Slack, Discord, or email"
  rules:
    - when: always
  allow_failure: true 